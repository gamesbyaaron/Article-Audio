name: Build APK

# Pushes to main publish a new build. Pull requests only test and build,
# so a change is checked before it is merged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests and APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk article-audio.apk

      - name: Verify APK (signature and manifest)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ls -l article-audio.apk
          sha256sum article-audio.apk
          "$BT/apksigner" verify --verbose --print-certs article-audio.apk
          "$BT/aapt2" dump badging article-audio.apk | head -5

      - name: Publish this build and the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          N=${GITHUB_RUN_NUMBER}
          # A permanent release for this build, so older builds stay downloadable.
          gh release create "build-$N" article-audio.apk \
            --target "$GITHUB_SHA" \
            --title "Build $N ($SHORT)" \
            --notes "Version 0.1.$N ($SHORT). Download article-audio.apk below and open it to install." \
            --latest=false
          # The rolling release behind the fixed download link.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest article-audio.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build ($SHORT)" \
            --notes "Same as Build $N. Download article-audio.apk below and open it to install." \
            --latest

      - name: Keep only the newest 20 build releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -E '^build-[0-9]+$' \
            | sort -t- -k2 -n -r \
            | tail -n +21 \
            | while read -r tag; do
                echo "Deleting old release $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
