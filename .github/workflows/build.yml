name: Build APK

on:
  push:
    # The ccr-* branch is a temporary extra trigger so the first release can be
    # checked before merging; remove it once main is building.
    branches: [main, ccr-d3a27e4f-2qpss9]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk article-audio.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest article-audio.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build ($SHORT)" \
            --notes "Build #${GITHUB_RUN_NUMBER} from ${GITHUB_REF_NAME} at commit ${SHORT}. Download article-audio.apk below and open it to install."
